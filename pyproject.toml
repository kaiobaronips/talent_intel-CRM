[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "talent-intel-crm"
version = "0.1.0"
description = "Temporal-based orchestration layer for Talent Intel CRM"
requires-python = ">=3.9"
dependencies = [
  "temporalio>=1.9.0",
  "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5.0",
  "pytest>=8.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
