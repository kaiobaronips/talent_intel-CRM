[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "talent-intel-crm"
version = "0.1.0"
description = "Temporal-based orchestration layer for Talent Intel CRM"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "temporalio>=1.9.0",
  "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "ruff>=0.5.0",
  "pytest>=8.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
ticrm-migrate = "talent_intel_crm.migrations:main"
