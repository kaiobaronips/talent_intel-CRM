name: CI

on:
  push:
    branches: [clean-main, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Test backend
        run: pytest -q
      - name: Lint backend
        run: ruff check .

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web
        run: npm ci --no-audit --no-fund
      - name: Typecheck web
        run: npm run typecheck
      - name: Lint web
        run: npm run lint
      - name: Build web
        run: npm run build
