services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["uvicorn", "talent_intel_crm.api:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["ticrm-migrate", "apply"]
    env_file:
      - ../.env
    profiles:
      - ops

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["python", "-m", "talent_intel_crm.worker"]
    env_file:
      - ../.env
    restart: unless-stopped
