services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["uvicorn", "talent_intel_crm.api:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["python", "-m", "talent_intel_crm.worker"]
    env_file:
      - ../.env
    restart: unless-stopped
